name: Version probe (temporary)
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest stable versions on Google Maven
        run: |
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/activity/activity-compose \
                   androidx/lifecycle/lifecycle-runtime-compose androidx/navigation/navigation-compose androidx/room/room-runtime \
                   androidx/datastore/datastore-preferences androidx/camera/camera-camera2 androidx/hilt/hilt-navigation-compose \
                   androidx/hilt/hilt-lifecycle-viewmodel-compose androidx/core/core-ktx androidx/exifinterface/exifinterface \
                   androidx/work/work-runtime-ktx androidx/test/ext/junit androidx/test/runner androidx/test/espresso/espresso-core \
                   com/google/mlkit/text-recognition androidx/compose/material/material-icons-extended androidx/compose/material3/material3 \
                   androidx/compose/ui/ui androidx/room/room-compiler androidx/sqlite/sqlite androidx/core/core-splashscreen; do
            v=$(curl -s https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -viE 'alpha|beta|rc|dev' | tail -4 | tr '\n' ' ')
            echo "$a => $v"
          done
      - name: SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools || true
          java -version
