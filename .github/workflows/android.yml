name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires du moteur thermique
        run: ./gradlew --no-daemon --stacktrace :core:thermal:test

      - name: Compilation de l'APK de debug
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Tests unitaires de l'application
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compilation des tests instrumentés
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest

      - name: APK release (R8, signé avec la clé de debug)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Publication des APK
        uses: actions/upload-artifact@v4
        with:
          name: thermohabitat-pro-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            core/thermal/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
