name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires du moteur thermique
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:thermal:test 2>&1 | tee -a build.log

      - name: Compilation de l'APK de debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee -a build.log

      - name: Tests unitaires de l'application
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee -a build.log

      - name: Compilation des tests instrumentés
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebugAndroidTest 2>&1 | tee -a build.log

      - name: APK release (R8, signé avec la clé de debug)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee -a build.log

      - name: Publication des APK
        uses: actions/upload-artifact@v4
        with:
          name: thermohabitat-pro-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            core/thermal/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Résumé des erreurs
        if: failure()
        run: |
          echo "===== ERREURS DE COMPILATION ====="
          grep -E "^e: |error: |\[ksp\].*error|> Task .* FAILED|What went wrong" -A2 build.log | grep -v "^--$" | head -150 || true
          echo "===== TESTS EN ÉCHEC ====="
          grep -E "FAILED$|Exception|expected:" build.log | head -60 || true

      # Captures d'écran de l'application réelle (Robolectric, 360 dp, police 130 % et 150 %) pour vérifier la mise en page.
      # Étape informative : elle n'empêche pas la publication des APK.
      - name: Captures d'écran
        if: always()
        continue-on-error: true
        run: |
          # Police système à 130 % puis à 150 % (cas le plus contraignant).
          for scale in 1.3 1.5; do
            ./gradlew --no-daemon :app:testDebugUnitTest --tests 'fr.thermohabitat.pro.ui.ScreenCaptureTest' -Pcaptures=true -PcapturesFontScale=$scale 2>&1 | tail -8
          done
          echo "===== ÉTAPES EN ÉCHEC ====="
          cat app/build/captures/errors*.txt 2>/dev/null || echo "(aucun fichier)"
          for f in app/build/captures/*.png; do
            [ -f "$f" ] || continue
            echo "=====CAPTURE $(basename "$f")"
            base64 -w 3000 "$f"
            echo "=====FIN"
          done

      - name: Publication des captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecrans
          path: app/build/captures/
          if-no-files-found: ignore
